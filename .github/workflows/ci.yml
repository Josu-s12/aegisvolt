# =============================================================================
# CI - se ejecuta en cada Pull Request hacia dev, test o prod (PRE-MERGE).
# Todos estos jobs son "required status checks" del ruleset: si uno falla,
# el botón Merge queda bloqueado.
# =============================================================================
name: CI (Pull Request)

on:
  pull_request:
    branches: [dev, test, prod]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "22"
  TF_VERSION: "1.9.8"
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL: http://localhost:4566
  # Ambiente destino del PR = rama base (dev | test | prod)
  TARGET_ENV: ${{ github.base_ref }}

jobs:
  # ---------------------------------------------------------------------------
  # Hace cumplir la cadena de promoción: feature/* -> dev -> test -> prod
  # ---------------------------------------------------------------------------
  promotion-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Validar origen -> destino del PR
        run: |
          BASE="${{ github.base_ref }}"
          HEAD="${{ github.head_ref }}"
          echo "PR: $HEAD -> $BASE"
          case "$BASE" in
            dev)  [[ "$HEAD" == feature/* || "$HEAD" == fix/* ]] || { echo "::error::A 'dev' solo entran ramas feature/* o fix/* (recibido: $HEAD)"; exit 1; } ;;
            test) [[ "$HEAD" == "dev" ]]  || { echo "::error::A 'test' solo se promueve desde 'dev' (recibido: $HEAD)"; exit 1; } ;;
            prod) [[ "$HEAD" == "test" ]] || { echo "::error::A 'prod' solo se promueve desde 'test' (recibido: $HEAD)"; exit 1; } ;;
            *)    echo "::error::Rama destino no permitida: $BASE"; exit 1 ;;
          esac
          echo "✅ Flujo de promoción válido"

  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            services/package-lock.json
            frontend/package-lock.json
      - name: Instalar dependencias backend
        working-directory: services
        run: npm ci
      - name: Lint (sintaxis de todos los módulos)
        working-directory: services
        run: npm run lint
      - name: Validar esquema GraphQL
        working-directory: services
        run: npm run validate:schema
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Build imágenes Docker (5)
        run: |
          for s in station-reservation-service billing-wallet-service energy-dispatch-service graphql-gateway; do
            docker build -f services/$s/Dockerfile -t aegisvolt/$s:${{ github.sha }} services
          done
          docker build -t aegisvolt/frontend:${{ github.sha }} frontend
          docker images | grep aegisvolt
      - name: Validar manifiestos Kubernetes (kustomize)
        run: for e in dev test prod; do kubectl kustomize k8s/overlays/$e > /dev/null && echo "overlay $e OK"; done

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/package-lock.json
      - working-directory: services
        run: npm ci
      - name: Unit tests (lógica de negocio + compensaciones SAGA)
        working-directory: services
        env:
          LOG_SILENT: "true"
        run: npm run test:unit

  integration-tests:
    runs-on: ubuntu-latest
    services:
      floci:
        image: floci/floci:latest
        ports: ["4566:4566"]
    env:
      APP_ENV: ${{ github.base_ref }}
      LOG_SILENT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/package-lock.json
      - working-directory: services
        run: npm ci
      - name: Esperar Floci
        run: for i in $(seq 1 30); do curl -sf http://localhost:4566/_floci/info >/dev/null && break; sleep 2; done
      - name: Crear tablas DynamoDB del ambiente + datos semilla
        working-directory: services
        run: npm run bootstrap:tables
      - name: Levantar microservicios + gateway
        working-directory: services
        run: bash scripts/start-stack.sh
      - name: Integration tests (DynamoDB + endpoints GraphQL)
        working-directory: services
        run: npm run test:integration
      - if: failure()
        run: tail -n 100 services/.logs/*.log

  e2e-tests:
    runs-on: ubuntu-latest
    services:
      floci:
        image: floci/floci:latest
        ports: ["4566:4566"]
    env:
      APP_ENV: ${{ github.base_ref }}
      LOG_SILENT: "true"
      CLOUDWATCH_LOGS_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/package-lock.json
      - working-directory: services
        run: npm ci
      - run: for i in $(seq 1 30); do curl -sf http://localhost:4566/_floci/info >/dev/null && break; sleep 2; done
      - working-directory: services
        run: npm run bootstrap:tables && bash scripts/start-stack.sh
      - name: E2E - flujo completo SAGA (éxito, fallo de hardware, fondos insuficientes, idempotencia)
        working-directory: services
        run: npm run test:e2e
      - name: Frontend sirve y consulta GraphQL
        run: |
          cd frontend && npm ci && npm run build
          npx vite preview --port 4173 & sleep 4
          curl -sf http://localhost:4173 | grep -q AegisVolt
          curl -sf http://localhost:4173/graphql -H 'content-type: application/json' -d '{"query":"{ environment { name } }"}' | tee /dev/stderr | grep -q "${{ github.base_ref }}"
      - if: failure()
        run: tail -n 100 services/.logs/*.log

  terraform-plan:
    runs-on: ubuntu-latest
    services:
      floci:
        image: floci/floci:latest
        ports: ["4566:4566"]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: for i in $(seq 1 30); do curl -sf http://localhost:4566/_floci/info >/dev/null && break; sleep 2; done
      - name: terraform fmt / validate
        working-directory: infra/envs
        run: |
          terraform fmt -check -recursive ../ || { echo "::warning::Ejecuta 'terraform fmt -recursive infra'"; }
          terraform init -backend=false -input=false
          terraform validate
      - name: Backend S3 versionado (bootstrap)
        working-directory: infra/bootstrap
        run: terraform init -input=false && terraform apply -input=false -auto-approve
      - name: Plan sobre el WORKSPACE de la rama destino
        working-directory: infra/envs
        run: |
          echo "Rama destino del PR: ${TARGET_ENV}  ->  workspace ${TARGET_ENV}"
          terraform init -input=false -reconfigure -backend-config=backend-floci.hcl
          terraform workspace select -or-create "${TARGET_ENV}"
          terraform workspace show
          terraform plan -input=false -var-file="${TARGET_ENV}.tfvars" -out=tfplan -no-color | tee plan.txt
          {
            echo "## terraform plan · workspace \`${TARGET_ENV}\`"
            echo '```'
            grep -E "^Plan:|No changes" plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.base_ref }}
          path: |
            infra/envs/tfplan
            infra/envs/plan.txt
