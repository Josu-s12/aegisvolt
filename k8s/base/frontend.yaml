apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app: frontend, part-of: aegisvolt }
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend, part-of: aegisvolt }
    spec:
      containers:
        - name: frontend
          image: aegisvolt/frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # nginx reenvía /graphql al gateway del MISMO namespace (= mismo ambiente)
            - { name: GRAPHQL_UPSTREAM, value: "http://graphql-gateway:4000" }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: { app: frontend, part-of: aegisvolt }
spec:
  type: NodePort
  selector: { app: frontend }
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
