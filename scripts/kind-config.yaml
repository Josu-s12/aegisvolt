# Clúster Kubernetes local (1 nodo). Puertos publicados en tu PC:
#   Frontend  dev/test/prod -> http://localhost:8081 / 8082 / 8083
#   GraphQL   dev/test/prod -> http://localhost:8401 / 8402 / 8403 (/graphql)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: aegisvolt
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30081, hostPort: 8081 }
      - { containerPort: 30082, hostPort: 8082 }
      - { containerPort: 30083, hostPort: 8083 }
      - { containerPort: 30401, hostPort: 8401 }
      - { containerPort: 30402, hostPort: 8402 }
      - { containerPort: 30403, hostPort: 8403 }
